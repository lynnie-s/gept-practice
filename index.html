<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全民英檢單字文法練習</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2a33;--mute:#7b7a86;--main:#ff7a45;--main-d:#e05a22;--ok:#2fb36d;--bad:#e5484d;--line:#f0e3cf;--blue:#4c6fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:24px;margin:8px 0 2px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(120,80,20,.06);margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:16px;background:#fffdf8}
input[type=text]:focus{outline:none;border-color:var(--main)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;padding:11px 8px;border:2px solid var(--line);background:#fffdf8;border-radius:12px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.seg button.on{border-color:var(--main);background:#fff0e6;color:var(--main-d)}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--main);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--main-d);margin-top:18px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--main-d)}
.btn.ghost{background:#fff;color:var(--main-d);border:2px solid var(--main);box-shadow:none}
.btn:disabled{opacity:.5}
.hide{display:none!important}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar{flex:1;height:12px;background:#f3e6d2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb36b,var(--main));width:0;transition:width .25s}
.cnt{font-weight:800;font-size:14px;color:var(--mute);min-width:52px;text-align:right}
.q{font-size:28px;font-weight:800;text-align:center;line-height:1.35;padding:18px 6px 6px}
.q.g{font-size:20px;text-align:left;font-weight:700}
.qhint{text-align:center;color:var(--mute);font-size:14px;min-height:20px}
.spk{display:inline-block;margin-left:8px;border:0;background:#eef2ff;color:var(--blue);border-radius:99px;padding:4px 10px;font-size:15px;cursor:pointer;vertical-align:middle}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{padding:14px 16px;border:2px solid var(--line);background:#fffdf8;border-radius:14px;font-size:18px;text-align:left;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:center}
.opt b{background:#f3e6d2;border-radius:8px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.opt.ok{border-color:var(--ok);background:#e9f9f0}
.opt.bad{border-color:var(--bad);background:#fdecec}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.5}
.fb.ok{background:#e9f9f0;color:#16774a}
.fb.bad{background:#fdecec;color:#a52a2e}
.score{font-size:64px;font-weight:900;text-align:center;color:var(--main-d);line-height:1}
.score small{font-size:20px;color:var(--mute)}
.msg{text-align:center;font-weight:700;margin:8px 0 4px}
.wrong{border-top:1px dashed var(--line);padding:10px 0;font-size:15px;line-height:1.5}
.wrong .a{color:var(--ok);font-weight:700}
.wrong .b{color:var(--bad);text-decoration:line-through}
.tag{display:inline-block;font-size:12px;background:#f3e6d2;border-radius:6px;padding:1px 7px;margin-right:6px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:18px}
.note a{color:var(--mute)}
.demo{background:#fff3c4;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

<!-- 開始畫面 -->
<section id="s-start">
  <h1>📚 英檢單字文法練習</h1>
  <div class="sub">全民英檢初級・中級｜每回 <span id="nq">30</span> 題</div>
  <div id="demoTip" class="demo hide">試玩模式：使用範例題庫，成績只存在這台裝置。</div>
  <div class="card">
    <label>你的名字</label>
    <input type="text" id="name" placeholder="例如：王小明" maxlength="20">

    <label>練習內容</label>
    <div class="seg" id="modeSeg">
      <button data-v="vocab" class="on">單字</button>
      <button data-v="grammar">文法</button>
      <button data-v="mixed">綜合</button>
      <button data-v="wrong">錯題本 <span id="wrongN"></span></button>
    </div>

    <label>難度範圍</label>
    <div class="seg" id="levelSeg">
      <button data-v="elementary" class="on">初級</button>
      <button data-v="intermediate">中級</button>
      <button data-v="all">初＋中級</button>
    </div>
    <button class="btn" id="go">開始練習</button>
  </div>
</section>

<!-- 作答畫面 -->
<section id="s-quiz" class="hide">
  <div class="top"><div class="bar"><i id="bar"></i></div><div class="cnt" id="cnt">1/30</div></div>
  <div class="card">
    <div class="q" id="qtext"></div>
    <div class="qhint" id="qhint"></div>
    <div class="opts" id="opts"></div>
    <div id="fb" class="fb hide"></div>
    <button class="btn hide" id="next">下一題</button>
  </div>
</section>

<!-- 結果畫面 -->
<section id="s-result" class="hide">
  <div class="card">
    <div class="score"><span id="rScore">0</span><small> 分</small></div>
    <div class="msg" id="rMsg"></div>
    <div class="qhint" id="rDetail"></div>
    <div class="qhint" id="rSave"></div>
  </div>
  <div class="card" id="wrongCard">
    <b>這回答錯的題目</b>
    <div id="wrongList"></div>
  </div>
  <button class="btn" id="again">再練一回</button>
  <button class="btn ghost" id="home">回首頁</button>
</section>

<div class="note">老師後台：<a href="admin.html">admin.html</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>
<script>
const N = (window.APP_CONFIG && window.APP_CONFIG.QUESTIONS_PER_QUIZ) || 30;
const $ = id => document.getElementById(id);
const st = { mode: "vocab", level: "elementary", qs: [], i: 0, answers: [], t0: 0, name: "" };
const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const SV = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const show = id => { ["s-start", "s-quiz", "s-result"].forEach(s => $(s).classList.toggle("hide", s !== id)); window.scrollTo(0, 0); };

$("nq").textContent = N;
if (!API.cloud) $("demoTip").classList.remove("hide");
$("name").value = LS("student_name", "");

function seg(id, key) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle("on", x === b));
    st[key] = b.dataset.v;
    if (id === "modeSeg") $("levelSeg").parentElement.querySelectorAll("label")[1].style.opacity = st.mode === "wrong" ? .4 : 1;
  });
}
seg("modeSeg", "mode"); seg("levelSeg", "level");

function wrongBook() { return LS("wrong_book", { v: [], g: [] }); }
function refreshWrongN() { const w = wrongBook(); const n = w.v.length + w.g.length; $("wrongN").textContent = n ? "(" + n + ")" : ""; }
refreshWrongN();

// ---------- 出題 ----------
function vocabQuestions(words, count) {
  const sel = pick(words, count);
  return sel.map(w => {
    const en2zh = Math.random() < 0.5;
    // 同一個字有多個詞性/意思時，不能把它的另一個意思當干擾選項
    const others = words.filter(x => x.id !== w.id && x.word.toLowerCase() !== w.word.toLowerCase());
    const samePos = others.filter(x => x.pos === w.pos);
    const pool = samePos.length >= 3 ? samePos : others;
    const key = en2zh ? "meaning" : "word";
    const seen = new Set();
    const uniq = pool.filter(x => { const k = x[key].toLowerCase(); if (seen.has(k) || (en2zh && x.meaning === w.meaning)) return false; seen.add(k); return true; });
    const ds = pick(uniq, 3);
    const opts = shuffle([w, ...ds]).map(x => x[key]);
    return {
      qtype: en2zh ? "vocab_en2zh" : "vocab_zh2en", qid: w.id,
      prompt: en2zh ? w.word : w.meaning, hint: en2zh ? (w.pos || "") : "選出正確的英文單字" + (w.pos ? "（" + w.pos + "）" : ""),
      speak: en2zh ? w.word : null, opts, correct: en2zh ? w.meaning : w.word, explain: w.word + " " + (w.pos || "") + " " + w.meaning
    };
  });
}
function grammarQuestions(gs, count) {
  return pick(gs, count).map(g => {
    const raw = [g.opt_a, g.opt_b, g.opt_c, g.opt_d];
    const correct = raw[g.answer];
    return { qtype: "grammar", qid: g.id, prompt: g.question, hint: g.topic || "", speak: null, grammar: true,
      opts: shuffle(raw), correct, explain: g.explanation || "" };
  });
}

$("go").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) { $("name").focus(); $("name").style.borderColor = "#e5484d"; return; }
  st.name = name; SV("student_name", name);
  $("go").disabled = true; $("go").textContent = "載入題庫中…";
  try {
    let qs = [];
    if (st.mode === "wrong") {
      const wb = wrongBook();
      const [aw, ag] = await Promise.all([API.getWords("all"), API.getGrammar("all")]);
      const vw = aw.filter(w => wb.v.includes(w.id));
      const gw = ag.filter(g => wb.g.includes(g.id));
      if (!vw.length && !gw.length) { alert("錯題本是空的，先去練習一回吧！"); return; }
      // 干擾選項仍用全體單字
      const vq = vocabQuestions(aw, 0);
      const vsel = pick(vw, N).map(w => vocabQuestions([w, ...pick(aw.filter(x => x.id !== w.id), 12)], 12).find(q => q.qid === w.id) || null).filter(Boolean);
      qs = shuffle([...vsel, ...grammarQuestions(gw, N)]).slice(0, N);
    } else if (st.mode === "vocab") {
      qs = vocabQuestions(await API.getWords(st.level), N);
    } else if (st.mode === "grammar") {
      qs = grammarQuestions(await API.getGrammar(st.level), N);
    } else {
      const [w, g] = await Promise.all([API.getWords(st.level), API.getGrammar(st.level)]);
      const half = Math.ceil(N / 2);
      qs = shuffle([...vocabQuestions(w, half), ...grammarQuestions(g, N - half)]);
    }
    if (!qs.length) { alert("這個範圍目前沒有題目，請請老師先匯入題庫。"); return; }
    st.qs = qs; st.i = 0; st.answers = []; st.t0 = Date.now();
    show("s-quiz"); render();
  } catch (e) {
    alert("載入題庫失敗：" + (e.message || e));
  } finally { $("go").disabled = false; $("go").textContent = "開始練習"; }
};

function speak(t) {
  try { const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

function render() {
  const q = st.qs[st.i];
  $("cnt").textContent = (st.i + 1) + "/" + st.qs.length;
  $("bar").style.width = (st.i / st.qs.length * 100) + "%";
  const qt = $("qtext");
  qt.className = "q" + (q.grammar ? " g" : "");
  qt.textContent = q.prompt;
  if (q.speak) {
    const b = document.createElement("button"); b.className = "spk"; b.textContent = "🔊"; b.onclick = () => speak(q.speak); qt.appendChild(b);
    speak(q.speak);
  }
  $("qhint").textContent = q.hint;
  $("fb").classList.add("hide"); $("next").classList.add("hide");
  const box = $("opts"); box.innerHTML = "";
  q.opts.forEach((o, idx) => {
    const b = document.createElement("button"); b.className = "opt";
    b.innerHTML = "<b>" + "ABCD"[idx] + "</b><span></span>"; b.querySelector("span").textContent = o;
    b.onclick = () => choose(o, b);
    box.appendChild(b);
  });
}

function choose(o, btn) {
  const q = st.qs[st.i];
  const ok = o === q.correct;
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    const t = b.querySelector("span").textContent;
    if (t === q.correct) b.classList.add("ok");
    else if (b === btn) b.classList.add("bad");
  });
  st.answers.push({ qtype: q.qtype, qid: q.qid, prompt: q.prompt, chosen: o, correct_answer: q.correct, is_correct: ok, _explain: q.explain });
  // 錯題本更新
  const wb = wrongBook(); const arr = q.qtype === "grammar" ? wb.g : wb.v; const i = arr.indexOf(q.qid);
  if (!ok && i < 0) arr.push(q.qid);
  if (ok && st.mode === "wrong" && i >= 0) arr.splice(i, 1);
  SV("wrong_book", wb);
  const fb = $("fb"); fb.classList.remove("hide", "ok", "bad"); fb.classList.add(ok ? "ok" : "bad");
  fb.textContent = (ok ? "答對了！" : "正確答案：" + q.correct) + (q.explain ? "　" + q.explain : "");
  $("next").classList.remove("hide");
  $("next").textContent = st.i + 1 >= st.qs.length ? "看成績" : "下一題";
  $("next").focus();
}

$("next").onclick = () => { st.i++; st.i >= st.qs.length ? finish() : render(); };

async function finish() {
  const total = st.answers.length, correct = st.answers.filter(a => a.is_correct).length;
  const score = Math.round(correct / total * 100);
  $("bar").style.width = "100%";
  show("s-result");
  $("rScore").textContent = score;
  $("rMsg").textContent = score >= 90 ? "太強了！🎉" : score >= 70 ? "不錯喔，繼續保持 💪" : score >= 50 ? "再練一回會更好 🌱" : "沒關係，錯題本幫你記著 📒";
  $("rDetail").textContent = "答對 " + correct + " / " + total + " 題";
  const wrongs = st.answers.filter(a => !a.is_correct);
  $("wrongCard").classList.toggle("hide", !wrongs.length);
  $("wrongList").innerHTML = "";
  wrongs.forEach(a => {
    const d = document.createElement("div"); d.className = "wrong";
    const tag = a.qtype === "grammar" ? "文法" : "單字";
    d.innerHTML = '<span class="tag">' + tag + '</span><span class="p"></span><br>你選：<span class="b"></span>　正確：<span class="a"></span>';
    d.querySelector(".p").textContent = a.prompt; d.querySelector(".b").textContent = a.chosen; d.querySelector(".a").textContent = a.correct_answer;
    $("wrongList").appendChild(d);
  });
  refreshWrongN();
  $("rSave").textContent = "成績儲存中…";
  try {
    await API.saveAttempt({
      student_name: st.name, mode: st.mode, level: st.mode === "wrong" ? "all" : st.level,
      total, correct, score, duration_sec: Math.round((Date.now() - st.t0) / 1000)
    }, st.answers.map(({ _explain, ...r }) => r));
    $("rSave").textContent = "✅ 成績已送出給老師";
  } catch (e) {
    $("rSave").textContent = "⚠️ 成績沒有送出成功（" + (e.message || e) + "），請告訴老師";
  }
}

$("again").onclick = () => $("go").click();
$("home").onclick = () => { refreshWrongN(); show("s-start"); };
</script>
</body>
</html>
